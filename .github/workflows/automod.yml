name: SiarnaQ AutoMod

on:
  discussion_comment:
    types: [created, deleted]

permissions:
  contents: write
  discussions: write

concurrency:
  group: siarnaq-automod
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest state
        run: |
          git pull --rebase origin main || true

      - name: Run AutoMod
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const action = context.payload.action;
            const comment = context.payload.comment;
            const discussion = context.payload.discussion;

            const commentId = comment?.node_id;
            const author = comment?.user?.login ?? "unknown";
            const authorType = comment?.user?.type ?? "User";
            const originalText = comment?.body ?? "";
            const now = new Date();

            const dataDirectory = ".github/automod";
            const statePath = path.join(dataDirectory, "state.json");
            const logPath = path.join(dataDirectory, "log.jsonl");

            fs.mkdirSync(dataDirectory, {
              recursive: true
            });

            let state = {
              replies: {},
              recentComments: {}
            };

            if (fs.existsSync(statePath)) {
              try {
                state = JSON.parse(
                  fs.readFileSync(statePath, "utf8")
                );
              } catch (error) {
                console.log(
                  "Eski state.json okunamadı, yenisi oluşturuluyor."
                );
              }
            }

            state.replies ??= {};
            state.recentComments ??= {};

            function saveState() {
              fs.writeFileSync(
                statePath,
                JSON.stringify(state, null, 2) + "\n"
              );
            }

            function addLog(type, details = {}) {
              const entry = {
                timestamp: new Date().toISOString(),
                type,
                ...details
              };

              fs.appendFileSync(
                logPath,
                JSON.stringify(entry) + "\n"
              );
            }

            async function addReaction(subjectId, reaction) {
              try {
                await github.graphql(
                  `
                    mutation(
                      $subjectId: ID!
                      $content: ReactionContent!
                    ) {
                      addReaction(
                        input: {
                          subjectId: $subjectId
                          content: $content
                        }
                      ) {
                        reaction {
                          content
                        }
                      }
                    }
                  `,
                  {
                    subjectId,
                    content: reaction
                  }
                );
              } catch (error) {
                console.log(
                  `Tepki eklenemedi: ${error.message}`
                );
              }
            }

            async function createReply(body) {
              const result = await github.graphql(
                `
                  mutation(
                    $discussionId: ID!
                    $replyToId: ID!
                    $body: String!
                  ) {
                    addDiscussionComment(
                      input: {
                        discussionId: $discussionId
                        replyToId: $replyToId
                        body: $body
                      }
                    ) {
                      comment {
                        id
                      }
                    }
                  }
                `,
                {
                  discussionId: discussion.node_id,
                  replyToId: commentId,
                  body
                }
              );

              return result.addDiscussionComment.comment.id;
            }

            async function deleteComment(nodeId) {
              await github.graphql(
                `
                  mutation($id: ID!) {
                    deleteDiscussionComment(
                      input: {
                        id: $id
                      }
                    ) {
                      clientMutationId
                    }
                  }
                `,
                {
                  id: nodeId
                }
              );
            }

            /*
             * YORUM SİLİNDİ
             *
             * Ana yorumun ID'si state dosyasında kayıtlıysa,
             * ona bağlı AutoMod cevabını da siler.
             */
            if (action === "deleted") {
              const automodReplyId =
                state.replies[commentId];

              if (automodReplyId) {
                try {
                  await deleteComment(automodReplyId);

                  addLog("automod_reply_deleted", {
                    parentCommentId: commentId,
                    automodReplyId
                  });

                  console.log(
                    "Ana yorum silindi; AutoMod cevabı da silindi."
                  );
                } catch (error) {
                  console.log(
                    `AutoMod cevabı silinemedi: ${error.message}`
                  );
                }

                delete state.replies[commentId];
              }

              /*
               * Kullanıcı doğrudan AutoMod cevabını silerse,
               * eski eşleşmeyi state dosyasından temizler.
               */
              for (
                const [parentId, replyId]
                of Object.entries(state.replies)
              ) {
                if (replyId === commentId) {
                  delete state.replies[parentId];
                }
              }

              saveState();
              return;
            }

            /*
             * BOTLARI ATLAMA
             */
            if (
              authorType === "Bot" ||
              author.toLowerCase() === "github-actions[bot]"
            ) {
              console.log("Bot yorumu atlandı.");
              return;
            }

            /*
             * METİN NORMALLEŞTİRME
             *
             * Örnek:
             * f.u.c.k
             * f u c k
             * b1tch
             * sh!t
             */
            const lowerText =
              originalText.toLocaleLowerCase("tr-TR");

            const normalizedText = lowerText
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/0/g, "o")
              .replace(/1/g, "i")
              .replace(/3/g, "e")
              .replace(/4/g, "a")
              .replace(/5/g, "s")
              .replace(/7/g, "t")
              .replace(/8/g, "b")
              .replace(/@/g, "a")
              .replace(/\$/g, "s")
              .replace(/[|!]/g, "i")
              .replace(/[^a-zçğıöşü0-9:/._\-\s]/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            /*
             * Harflerin arasına nokta, tire veya boşluk
             * koyularak gizlenen sözcükleri yakalamak için
             * ikinci bir sürüm.
             */
            const compactText = normalizedText
              .replace(/[\s._\-*]+/g, "");

            const bannedWords = [
              // İngilizce
              "fuck",
              "fucker",
              "fucking",
              "motherfucker",
              "motherfucking",
              "shit",
              "bullshit",
              "shithead",
              "pieceofshit",
              "bitch",
              "bastard",
              "asshole",
              "dickhead",
              "dumbass",
              "jackass",
              "dipshit",
              "scumbag",
              "cunt",
              "whore",
              "slut",
              "hooker",
              "prick",
              "wanker",
              "cock",
              "dick",
              "pussy",
              "cum",
              "porn",
              "porno",

              // Türkçe
              "amk",
              "siktir",
              "sikerim",
              "sikeyim",
              "sikik",
              "orospu",
              "kahpe",
              "kaltak",
              "pezevenk",
              "piç",
              "pic",
              "gavat",
              "yavşak",
              "yavsak",
              "şerefsiz",
              "serefsiz",
              "haysiyetsiz",
              "namussuz",
              "gerizekalı",
              "gerizekali",
              "dangalak",
              "embesil",
              "ahmak",
              "bok",
              "boktan",
              "götveren",
              "gotveren",
              "yarak",
              "taşak",
              "tasak"
            ];

            /*
             * Daha kısa ve normal cümlelerde de kullanılabilecek
             * kelimeleri yalnızca bağımsız sözcük olarak kontrol eder.
             */
            const insultWords = [
              "idiot",
              "moron",
              "loser",
              "stupid",
              "retard",
              "salak",
              "aptal",
              "ezik",
              "mal"
            ];

            const bannedPhrases = [
              "fuck you",
              "go fuck yourself",
              "son of a bitch",
              "piece of shit",
              "shut the fuck up",
              "kill yourself",
              "you should die",
              "nobody likes you",
              "you are worthless",
              "you are useless",
              "i hate you",

              "ananı sikerim",
              "anani sikerim",
              "amına koyarım",
              "amina koyarim",
              "amına koyayım",
              "amina koyayim",
              "seni sikerim",
              "geber git",
              "öl git",
              "ol git",
              "kendini öldür",
              "kendini oldur",
              "kimse seni sevmiyor",
              "senden nefret ediyorum",
              "seni bulacağım",
              "seni bulacagim",
              "adresini bulurum"
            ];

            const suspiciousParts = [
              // Davet ve kısa bağlantılar
              "discord.gg/",
              "discord.com/invite/",
              "bit.ly/",
              "tinyurl.com/",
              "cutt.ly/",
              "rb.gy/",
              "t.me/",
              "telegram.me/",
              "wa.me/",

              // Kumar
              ".bet",
              ".casino",
              ".poker",
              "onlinecasino",
              "sportsbook",
              "betting",
              "freebet",
              "slotbonus",
              "jackpot",
              "roulette",
              "blackjack",
              "yatırımsız bonus",
              "yatirimsiz bonus",
              "deneme bonusu",
              "bedava bonus",
              "hoş geldin bonusu",
              "hos geldin bonusu",

              // Sahte ödül ve dolandırıcılık
              "free robux",
              "bedava robux",
              "free vbucks",
              "bedava vbucks",
              "free nitro",
              "bedava nitro",
              "gift card generator",
              "claim your prize",
              "you won a prize",
              "click here to win",
              "earn money fast",
              "make money fast",
              "hesabını doğrula",
              "hesabini dogrula",
              "şifreni gir",
              "sifreni gir"
            ];

            const escapeRegex = (value) =>
              value.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );

            const matchedPhrase =
              bannedPhrases.find((phrase) =>
                normalizedText.includes(phrase)
              );

            const matchedWord =
              bannedWords.find((word) => {
                /*
                 * Normal yazımı bağımsız kelime olarak ara.
                 */
                const normalPattern = new RegExp(
                  `(^|[^a-zçğıöşü0-9_])` +
                  `${escapeRegex(word)}` +
                  `(?=$|[^a-zçğıöşü0-9_])`,
                  "iu"
                );

                if (normalPattern.test(normalizedText)) {
                  return true;
                }

                /*
                 * Uzun sözcüklerde nokta ve boşlukla
                 * gizlenmiş yazımı da ara.
                 */
                if (
                  word.length >= 4 &&
                  compactText.includes(
                    word.replace(/\s/g, "")
                  )
                ) {
                  return true;
                }

                return false;
              });

            const matchedInsult =
              insultWords.find((word) => {
                const pattern = new RegExp(
                  `(^|[^a-zçğıöşü0-9_])` +
                  `${escapeRegex(word)}` +
                  `(?=$|[^a-zçğıöşü0-9_])`,
                  "iu"
                );

                return pattern.test(normalizedText);
              });

            const matchedSuspiciousPart =
              suspiciousParts.find((part) =>
                lowerText.includes(
                  part.toLocaleLowerCase("tr-TR")
                )
              );

            /*
             * GENEL SPAM KONTROLLERİ
             */
            const links =
              originalText.match(
                /(?:https?:\/\/|www\.)[^\s<>"')\]]+/gi
              ) ?? [];

            const mentions =
              originalText.match(
                /(^|\s)@[a-z0-9-]+/gi
              ) ?? [];

            const tooManyLinks = links.length >= 3;
            const tooManyMentions = mentions.length >= 5;

            const repeatedCharacters =
              /(.)\1{7,}/su.test(originalText);

            const repeatedWords =
              /\b([\p{L}\p{N}_]{2,})\b(?:[\s,.!?_-]+\1\b){5,}/iu
                .test(originalText);

            const letters =
              originalText.match(/\p{L}/gu) ?? [];

            const uppercaseLetters =
              originalText.match(/\p{Lu}/gu) ?? [];

            const excessiveUppercase =
              letters.length >= 20 &&
              uppercaseLetters.length /
                letters.length >= 0.75;

            const excessiveLength =
              originalText.length > 4000;

            /*
             * 10 SANİYEDE 3 YORUM KONTROLÜ
             */
            const nowMilliseconds = now.getTime();
            const tenSecondsAgo =
              nowMilliseconds - 10_000;

            const previousTimes =
              state.recentComments[author] ?? [];

            const recentTimes = previousTimes
              .map(Number)
              .filter(
                (timestamp) =>
                  timestamp >= tenSecondsAgo
              );

            recentTimes.push(nowMilliseconds);

            state.recentComments[author] =
              recentTimes;

            const rapidSpam =
              recentTimes.length >= 3;

            /*
             * Çok eski kullanıcı kayıtlarını temizle.
             */
            for (
              const [username, timestamps]
              of Object.entries(
                state.recentComments
              )
            ) {
              const validTimes = timestamps
                .map(Number)
                .filter(
                  (timestamp) =>
                    timestamp >= tenSecondsAgo
                );

              if (validTimes.length === 0) {
                delete state.recentComments[
                  username
                ];
              } else {
                state.recentComments[
                  username
                ] = validTimes;
              }
            }

            const reasons = [];

            if (matchedWord) {
              reasons.push("küfür veya uygunsuz kelime");
            }

            if (matchedInsult) {
              reasons.push("hakaret");
            }

            if (matchedPhrase) {
              reasons.push("hakaret veya tehdit kalıbı");
            }

            if (matchedSuspiciousPart) {
              reasons.push(
                "şüpheli bağlantı veya reklam"
              );
            }

            if (tooManyLinks) {
              reasons.push("çok fazla bağlantı");
            }

            if (tooManyMentions) {
              reasons.push(
                "çok fazla kullanıcı etiketi"
              );
            }

            if (repeatedCharacters) {
              reasons.push("karakter tekrarı");
            }

            if (repeatedWords) {
              reasons.push("kelime tekrarı");
            }

            if (excessiveUppercase) {
              reasons.push("aşırı büyük harf");
            }

            if (excessiveLength) {
              reasons.push("aşırı uzun yorum");
            }

            if (rapidSpam) {
              reasons.push(
                "10 saniye içinde 3 yorum"
              );
            }

            /*
             * TEMİZ YORUM
             */
            if (reasons.length === 0) {
              await addReaction(
                commentId,
                "THUMBS_UP"
              );

              addLog("clean_comment", {
                author,
                commentId
              });

              saveState();

              console.log(
                `Temiz yorum: ${author}`
              );

              return;
            }

            /*
             * FİLTREYE TAKILAN YORUM
             */
            await addReaction(
              commentId,
              "THUMBS_DOWN"
            );

            const warningBody =
              `⚠️ **SiarnaQ AutoMod**\n\n` +
              `Bu yorum otomatik moderasyon sistemine takıldı.\n\n` +
              `**Sebep:** ${reasons.join(", ")}.\n\n` +
              `Lütfen küfür, hakaret, tehdit, reklam ve spam içermeyen bir dil kullanın.`;

            try {
              const replyId =
                await createReply(warningBody);

              state.replies[commentId] =
                replyId;

              addLog("flagged_comment", {
                author,
                commentId,
                automodReplyId: replyId,
                reasons
              });

              console.log(
                `Yorum filtreye takıldı: ${reasons.join(", ")}`
              );
            } catch (error) {
              addLog("automod_error", {
                author,
                commentId,
                error: error.message
              });

              throw error;
            }

            saveState();

      - name: Save AutoMod state and log
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/automod/state.json
          git add .github/automod/log.jsonl

          git commit -m "Update SiarnaQ AutoMod log"
          git push origin main
